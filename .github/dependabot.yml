version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-all:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /media/research-overview
    schedule:
      interval: weekly

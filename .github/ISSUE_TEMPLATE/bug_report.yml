name: 🐛 Bug Report
description: Etwas funktioniert nicht wie dokumentiert
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Ein öffentliches Issue ist weltweit sichtbar. Keine echten Moodle-Dateien,
        personenbezogenen Daten, Tokens, internen Routen oder privaten Logs einfügen.
        Security-/Privacy-Probleme bitte ausschließlich privat melden.
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Beobachtetes vs. erwartetes Verhalten.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduktion
      placeholder: |
        1. `cdd init`
        2. `cdd validate`
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Ausgabe von `cdd version` + OS
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Kontext / Logs
      description: Nur minimierte, synthetische Reproduktion. Keine `.spot/`-Knoten oder Logs aus privaten Systemen.
  - type: checkboxes
    id: public_safe
    attributes:
      label: Veröffentlichungsprüfung
      options:
        - label: Ich habe personenbezogene Daten, Credentials und private Infrastrukturangaben entfernt.
          required: true
